# Production stack for one Ubuntu server: PostgreSQL + backend API + Caddy (HTTPS + the web portals).
# Start:  cd deploy && docker compose up -d --build        (install.sh does this for you)
# Nothing but Caddy is reachable from outside (ports 80/443).
services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: jbaya
      POSTGRES_USER: jbaya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      TZ: Asia/Baghdad
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jbaya -d jbaya"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ../jbaya-backend
    restart: always
    env_file: .env
    environment:
      DB_CONN: postgresql://jbaya:${POSTGRES_PASSWORD}@db:5432/jbaya
      STORAGE_DIR: /srv/storage
    volumes:
      - storage:/srv/storage          # meter photos, bills, documents
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in deploy/.env}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro             # the Flutter web build (office portals), see README
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  # Only if the server has NO public IP: a Cloudflare Tunnel publishes it instead of opening ports.
  # Start with:  docker compose --profile tunnel up -d   (and set CLOUDFLARE_TUNNEL_TOKEN in .env)
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    profiles: ["tunnel"]
    depends_on:
      - caddy

volumes:
  db_data:
  storage:
  caddy_data:
  caddy_config:
